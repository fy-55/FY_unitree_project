bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # MPPI-SPECIFIC CHANGE:
    # Keep a valid global path instead of recomputing it at 2 Hz. This avoids
    # repeatedly calling the custom controller's setPlan() and clearing its
    # warm-start sequence. Goal updates, invalid paths, and recovery failures
    # still trigger a fresh global plan. RPP continues using its original tree.
    default_nav_to_pose_bt_xml: "$(find-pkg-share g1_nav_nav2)/behavior_trees/navigate_to_pose_mppi_path_valid_replanning.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share g1_nav_nav2)/behavior_trees/navigate_through_poses_replanning_only.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: nav2_custom_plugins/MPPIGPUController

      # num_samples: 8000
      # prediction_horizon: 5
      # dt: 0.1
      # max_v: 0.40
      # min_v: 0.0
      # max_vy: 0.40
      # max_w: 0.50

      # # ── 代价 ──
      # cost_scale: 50.0
      # obstacle_ratio: 0.50
      # tracking_ratio: 0.40
      # speed_ratio: 0.15
      # lambda: 0.05

      # # ── 噪声 ──
      # action_std_v: 0.2
      # action_std_vy: 0.0
      # action_std_w: 0.4

      # # ── 碰撞 ──
      # footprint_front: 0.23
      # footprint_back: 0.23
      # footprint_left: 0.38
      # footprint_right: 0.38

      # # ── 子类权重 ──
      # footprint_weight: 1.0
      # path_align_weight: 1.0
      # path_angle_weight: 2.0
      # path_deviation_weight: 0.3
      # speed_reward_weight: 1.0
      # base_similarity_weight: 0.5     # warm-start 一致性约束

      # # ── 前瞻 ──
      # min_lookahead_dist: 0.3
      # lookahead_kp: 0.1               # 前瞻减速最低比例 (0=完全停止)
      # lookahead_decel_dist: 0.5        # 开始减速距离 (m)
      # lookahead_overshoot_weight: 5.0  # 越界惩罚系数

      # # ── 终端朝向: 距终点此距离内直接发 goal_yaw ──
      # terminal_angle_dist: 0.05
      # terminal_angle_tolerance: 0.17

      # # ── 路径 / 输出模式 ──
      # use_planner_yaw: false           # true=planner朝向, false=自算切线
      # use_global_mode: false           # true=odom系输出, false=base_link系

      # # ── 状态机 ──
      # enable_heading_speed_limit: true
      # heading_misalign_threshold: 1.047
      # enable_narrow_passage: false

      # # ── EMA ──
      # enable_ema: false
      # ema_alpha: 0.1

      # # ── 日志 ──
      # enable_file_log: true
      # log_file_path: "/tmp/mppi_steering_controller.log"
      cost_scale: 50.0
      obstacle_ratio: 0.80
      tracking_ratio: 0.20
      speed_ratio: 0.05
      # 独立偏离路径代价 (软墙)
      path_deviation_weight: 0.0
      path_corridor: 0.15

      # MPPI-SPECIFIC CHANGE (real-robot preflight): 8000 samples produced a
      # short burst of missed 10 Hz control deadlines. Start from 4000 and only
      # increase after runtime logs prove stable timing on this computer.
      num_samples: 4000
      prediction_horizon: 10
      dt: 0.1
      max_v: 0.70
      min_v: 0.0
      max_vy: 0.0
      max_w: 0.80

      # 注意：当前这份新插件源码尚未使用 ControllerServer 传入的 current_vel，
      # 因此这里不保留“当前速度/加速度模型”参数，避免误以为它们已经生效。

      action_std_v: 0.5
      action_std_vy: 0.0
      action_std_w: 0.4
      nln_ratio: 0.35
      noise_decay_rate: 0.55
      noise_scale_floor_vx: 0.35
      noise_scale_floor_vy: 0.30
      noise_scale_floor_w: 0.30
      cross_track_noise_scale: 1.5

      turn_lateral_boost: 2.0
      lateral_guidance_scale: 0.7   # vx/vy采样向lookahead方向混合比例

      lambda: 4.0     # 更平滑, 降低高速样本的独占权重, 抑制激进提速

      # MPPI直接使用包含0.03 m安全余量后的外廓，须与下方costmap一致。
      footprint_front: 0.23
      footprint_back: 0.23
      footprint_left: 0.38
      footprint_right: 0.38
      footprint_sample_spacing: 0.04
      rear_obstacle_cost: 0.0

      min_lookahead_dist: 0.5
      lookahead_kp: 1.0

      # MPPI负责走到目标位置；进入0.18m后停止平移，只对准最终yaw。
      # 该值应略小于SimpleGoalChecker的xy_goal_tolerance=0.20m。
      terminal_angle_dist: 0.15
      terminal_angle_kp: 1.0
      # 比Goal Checker的yaw_goal_tolerance=0.25rad更严格，留出判断裕量。
      terminal_angle_tolerance: 0.20

      global_trajectory_ratio: 0.0
      global_horizon: 50
      use_global_costmap: true
      global_costmap_topic: /global_costmap/costmap

      pure_rotation_ratio: 0.10
      pure_rotation_steps: 2
      enable_lateral_bias: false
      enable_heading_speed_limit: true
      # G1只能前进+转向；不要依赖NavFn路径点中可能无效的orientation。
      # 当前瞻点位于身后时，按真实几何方向先原地转向，再交回MPPI跟踪。
      use_geometric_heading_for_alignment: true
      heading_misalign_threshold: 1.047
      enable_narrow_passage: false
      enable_ema: false
      ema_alpha: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.30
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # G1 measured envelope with arms hanging: about 0.35 m long and
      # 0.65--0.70 m wide. Use the same footprint and filtering chain as RPP,
      # so the controller is the only experimental variable.
      footprint: "[[0.20, 0.35], [0.20, -0.35], [-0.20, -0.35], [-0.20, 0.35]]"
      footprint_padding: 0.03
      plugins: [obstacle_layer, denoise_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.30
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
      denoise_layer:
        plugin: nav2_costmap_2d::DenoiseLayer
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.30
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.20, 0.35], [0.20, -0.35], [-0.20, -0.35], [-0.20, 0.35]]"
      footprint_padding: 0.03
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.30
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.30

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 500

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.8, 0.0, 0.80]
    min_velocity: [0.0, 0.0, -0.80]
    max_accel: [0.35, 0.0, 0.80]
    max_decel: [-0.35, 0.0, -0.80]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 0.30
