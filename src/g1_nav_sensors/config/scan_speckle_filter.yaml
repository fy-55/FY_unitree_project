g1_scan_speckle_filter:
  ros__parameters:
    filter1:
      name: speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        # Distance mode keeps a return when it has at least one adjacent
        # beam at a similar range.  This removes isolated single-beam noise
        # while retaining two-beam chair legs and continuous walls.
        filter_type: 0
        max_range: 3.0
        max_range_difference: 0.10
        filter_window: 2
